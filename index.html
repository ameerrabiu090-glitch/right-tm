<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Right TM Login</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0d0d0d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.box{
width:350px;
background:#181818;
padding:30px;
border:1px solid gold;
border-radius:10px;
}

h2{
text-align:center;
color:gold;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
background:#222;
border:1px solid #555;
color:#fff;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:gold;
border:none;
font-weight:bold;
border-radius:5px;
cursor:pointer;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:gold;
text-decoration:none;
}
</style>

</head>

<body>

<div class="box">

<h2>RIGHT TM LOGIN</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<p>Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

</body>
</html>
